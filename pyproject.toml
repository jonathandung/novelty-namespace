[build-system]
build-backend = "uv_build"
requires = ["uv_build>=0.13.10"]

[dependency-groups]
cov = ["coverage==7.17.5"]
docs = ["furo==2025.12.19", "sphinx==9.2.0", "sphinx-copybutton==0.5.2", "sphinx-notfound-page==1.1.0"]

[project]
authors = [{name = "Jonathan Dung", email = "jonathandung@yahoo.com"}]
classifiers = ["Development Status :: 3 - Alpha", "Programming Language :: Python :: 3", "Programming Language :: Python :: 3 :: Only", "Programming Language :: Python :: 3.15", "Programming Language :: Python :: 3.16", "Programming Language :: Python :: Free Threading :: 1 - Unstable"]
license = "MIT"
license-files = ["AUTHORS.md", "LICENSE"]
maintainers = [{name = "Jonathan Dung", email = "jonathandung@yahoo.com"}]
name = "novelty-namespace"
readme = "README.md"
requires-python = ">=3.15"
version = "0.4.0"

[tool.esbonio.sphinx]
pythonCommand = ["${venv:.venv}"]

[tool.ruff]
required-version = ">=0.17.6"

[tool.ruff.lint]
ignore = ["blank-line-before-class", "incorrect-blank-line-before-class", "invalid-class-name", "missing-trailing-comma", "multi-line-summary-second-line", "non-empty-init-module", "PT"]
preview = true
select = ["ALL"]
typing-extensions = false

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["contextlib.suppress", "__import__"]

[tool.ruff.lint.per-file-ignores]
"*.py" = ["ANN", "undocumented-magic-method", "undocumented-public-class"]
"!novelty_namespace/__init__.py" = ["missing-copyright-notice"]
"docs/source/conf.py" = ["implicit-namespace-package", "missing-copyright-notice", "undocumented-public-module", "undocumented-public-package"]

[tool.ty.rules]
all = "error"
missing-override-decorator = "ignore"

[tool.ty.src]
include = ["novelty_namespace/"]

[tool.uv]
preview = true
required-version = ">=0.13.10"

[tool.uv.build-backend]
module-name = "novelty_namespace"
module-root = ""
