[build-system]
build-backend = "uv_build"
requires = ["uv_build>=0.13.3"]

[project]
authors = [{name = "Jonathan Dung", email = "jonathandung@yahoo.com"}]
classifiers = ["Development Status :: 3 - Alpha", "Programming Language :: Python :: 3"]
license = "MIT"
license-files = ["AUTHORS.md", "LICENSE"]
maintainers = [{name = "Jonathan Dung", email = "jonathandung@yahoo.com"}]
name = "novelty-namespace"
readme = "README.md"
requires-python = ">=3.12"
version = "0.1.0"

[tool.ruff]
required-version = ">=0.17.1"

[tool.ruff.lint]
ignore = ["blank-line-before-class", "incorrect-blank-line-before-class", "missing-trailing-comma", "multi-line-summary-second-line", "non-empty-init-module"]
preview = true
select = ["ALL"]
typing-extensions = false

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["contextlib.suppress"]

[tool.ruff.lint.per-file-ignores]
"*.py" = ["ANN", "undocumented-magic-method", "undocumented-public-class"]
"docs/source/conf.py" = ["implicit-namespace-package", "missing-copyright-notice", "undocumented-public-module", "undocumented-public-package"]

[tool.ty.rules]
all = "error"
missing-override-decorator = "ignore"

[tool.uv]
required-version = ">=0.13.3"

[tool.uv.build-backend]
module-name = "novelty_namespace"
module-root = ""
