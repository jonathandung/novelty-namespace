name: Build and publish
on:
  release:
    types: [published]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  publish:
    permissions:
      id-token: write
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/novelty-namespace/${{github.event.release.name}}
    steps:
      - run: |
          if [[ ! $NAME =~ ^[0-9]+\.(25[0-5]|2[0-4][0-9]|1[0-9]{2}|[1-9]?[0-9])\.(25[0-5]|2[0-4][0-9]|1[0-9]{2}|[1-9]?[0-9])$ ]]; then
            echo "Release name '$NAME' does not match the expected format 'X.Y.Z', with both Y and Z between 0 and 255"
            exit 1
          fi
        env:
          NAME: ${{github.event.release.name}}
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d
        with:
          enable-cache: false
      - run: uv build
      - run: uv publish
    timeout-minutes: 1
