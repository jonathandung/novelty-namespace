name: Update prek hooks
on:
  schedule: [{cron: "0 0 * * 1"}]
  workflow_dispatch:
permissions:
  contents: write
  pull-requests: write
jobs:
  update:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # zizmor: ignore[artipacked]
      - run: brew update && brew install prek && prek update
      - uses: peter-evans/create-pull-request@15733dbdfeedb4f7fdb73d13c6f5ac83b710fab8
        with:
          assignees: jonathandung
          branch: prek
          commit-message: update prek hooks
          delete-branch: true
          sign-commits: true
          signoff: true
          title: Weekly prek hooks update
    timeout-minutes: 1
