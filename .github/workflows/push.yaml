name: CI
concurrency:
  group: ${{github.workflow}}-${{github.ref}}
  cancel-in-progress: true
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  primary:
    permissions:
      security-events: write
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        persist-credentials: false
        ref: ${{github.event.pull_request.head.sha || github.sha}}
    - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2
      with:
        enable-cache: false
    - run: uvx ruff check --output-format github
    - run: uvx ty check --output-format github
    - uses: DavidAnson/markdownlint-cli2-action@696eb3f2509270d7b882d2aa68347bc676e7af34
      with:
        globs: |
          *.md
          .github/**/*.md
    - uses: streetsidesoftware/cspell-action@ce1816e4ce36532956ac6e983737392774b6e169
      with:
        config: cspell.json
        incremental_files_only: true
    - run: uv audit --preview-features audit-command
    - uses: zizmorcore/zizmor-action@53290badfa369cb0bf7ad16342cb62c2fa47ac7b
    timeout-minutes: 3
